<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood Request | BloodConnectIndia</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#172033}.public-header{padding:1rem;background:#c00000}.public-header a{color:#fff;text-decoration:none;font-weight:800}.container{width:min(520px,calc(100% - 2rem));margin:2rem auto;background:#fff;padding:clamp(1.25rem,4vw,2rem);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}h1{color:#c00000;margin-top:0}label{display:block;font-weight:700;margin-top:1rem}input,select,textarea{width:100%;padding:.7rem;margin-top:.35rem;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;font:inherit}textarea{min-height:90px;resize:vertical}.field-error{display:block;min-height:1.2rem;color:#991b1b;font-size:.82rem}.actions{display:flex;gap:.75rem;margin-top:1rem}.button{background:#c00000;color:#fff;padding:.75rem 1rem;border:0;border-radius:7px;cursor:pointer;font-weight:700}.button:disabled{opacity:.6;cursor:not-allowed}.button-secondary{background:#fff;color:#172033;border:1px solid #cbd5e1}.form-status{margin-top:1rem;min-height:1.5rem}.form-status[data-state=error]{color:#991b1b}.form-status[data-state=success]{color:#166534}@media(max-width:480px){.container{margin:1rem auto}.actions{flex-direction:column}.button{width:100%}}</style></head><body><header class="public-header"><a href="../index.html">BloodConnectIndia</a></header><main class="container"><h1>Blood Request Form</h1><p>Submit a request for review. Submission does not guarantee availability or fulfillment.</p><form id="blood-request-form" novalidate><label for="patient_name">Patient name</label><input type="text" id="patient_name" name="patient_name" minlength="2" maxlength="120" autocomplete="name" required aria-describedby="patient-name-error"><span id="patient-name-error" class="field-error" role="alert"></span><label for="blood_group">Blood group</label><select id="blood_group" name="blood_group" required aria-describedby="blood-group-error"><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><span id="blood-group-error" class="field-error" role="alert"></span><label for="hospital">Hospital name</label><input type="text" id="hospital" name="hospital" minlength="2" maxlength="160" required aria-describedby="hospital-error"><span id="hospital-error" class="field-error" role="alert"></span><label for="mobile">Indian mobile number</label><input type="tel" id="mobile" name="mobile" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="9876543210" required aria-describedby="mobile-error"><span id="mobile-error" class="field-error" role="alert"></span><label for="address">Address</label><textarea id="address" name="address" minlength="5" maxlength="500" required aria-describedby="address-error"></textarea><span id="address-error" class="field-error" role="alert"></span><div class="actions"><button id="blood-request-submit" class="button" type="submit">Submit blood request</button><button class="button button-secondary" type="reset">Reset</button></div></form><p id="blood-request-status" class="form-status" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/blood-request.js"></script></body></html>
