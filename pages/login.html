<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | BloodConnectIndia</title><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/auth.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card" aria-labelledby="login-title">
  <header class="auth-header"><a class="auth-brand" href="../index.html" aria-label="BloodConnectIndia home"><span class="auth-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.8S5.5 10 5.5 14.8a6.5 6.5 0 0 0 13 0C18.5 10 12 2.8 12 2.8Z"/><path d="M9.2 15.2a3 3 0 0 0 3 3"/></svg></span><span>BloodConnectIndia<small>Connecting Donors. Saving Lives.</small></span></a><div class="auth-kicker"><span aria-hidden="true"></span>Secure account access</div><h1 id="login-title">Welcome back</h1><p>Sign in with your registered account. Your workspace is assigned securely after verification.</p></header>
  <form id="common-login-form" class="auth-form">
    <div class="auth-field"><label for="login-email">Email address</label><div class="input-frame"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg><input id="login-email" name="email" type="email" autocomplete="username" maxlength="320" placeholder="name@example.com" required></div></div>
    <div class="auth-field"><div class="label-row"><label for="login-password">Password</label><a href="admin-forgot-password.html">Forgot password?</a></div><div class="input-frame password-field"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password" aria-pressed="false"><svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.1A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6M6.3 6.3C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6c1.5 0 2.8-.4 4-1"/></svg></button></div></div>
    <button id="common-login-submit" class="button auth-submit" type="submit">Sign in securely</button>
  </form><p id="common-login-message" class="auth-message" role="alert" aria-live="polite"></p><footer class="auth-assurance"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.7 2.9 8.2 7 10 4.1-1.8 7-5.3 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>Protected by secure account verification</footer>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/common-login.js"></script></body></html>
