<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Request - Blood Connect India</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
  <h1>🩸 Blood Request</h1>

  <form>
    <label>Patient Name</label><br>
    <input type="text" placeholder="Enter Patient Name"><br><br>

    <label>Mobile Number</label><br>
    <input type="tel" placeholder="Enter Mobile Number"><br><br>

    <label>Blood Group</label><br>
    <select>
      <option>A+</option>
      <option>A-</option>
      <option>B+</option>
      <option>B-</option>
      <option>AB+</option>
      <option>AB-</option>
      <option>O+</option>
      <option>O-</option>
    </select><br><br>

    <button type="submit" class="btn">Submit Request</button>
  </form>

</div>

<script src="../js/app.js"></script>

</body>
</html>
