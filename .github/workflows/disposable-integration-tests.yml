name: Disposable Supabase integration tests

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_DISPOSABLE_LOCAL_INTEGRATION exactly
        required: true
        type: string
      database_execution:
        description: Allow runner-local database phases after all readiness guards pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bloodconnectindia-disposable-integration
  cancel-in-progress: false

jobs:
  static-safety:
    name: Static safety review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact task revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 2.8.1

      - name: Validate workflow and harness statically
        run: deno test --allow-read=. tests/authoritative-schema-preflight-static.test.ts tests/canonical-identity-foundation-static.test.ts tests/identity-reconciliation-evidence.test.ts tests/integration-harness-static.test.ts tests/migration-integrity-static.test.ts tests/disposable-phase-driver-static.test.ts tests/github-workflow-static.test.ts tests/disposable-runtime-env-static.test.ts tests/local-tool-resolution-static.test.ts tests/admin-session-runtime-static.test.ts

  disposable-integration:
    name: Runner-local Supabase integration
    needs: static-safety
    if: ${{ inputs.database_execution && inputs.confirmation == 'RUN_DISPOSABLE_LOCAL_INTEGRATION' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BCI_DISPOSABLE_APPROVAL: approved
      BCI_TEST_RUN_ID: bci-local-${{ github.run_id }}-${{ github.run_attempt }}
      BCI_DATABASE_HOST: 127.0.0.1
      BCI_DATABASE_PORT: "54322"
      BCI_DATABASE_NAME: postgres
      BCI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout exact task revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 2.8.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Hard local-only safety and readiness gate
        env:
          BCI_TRIGGER_CONFIRMATION: ${{ inputs.confirmation }}
        run: deno run --allow-env --allow-read=. scripts/ci/disposable-integration-guard.ts

      - name: Run approved migration manifest guard
        shell: pwsh
        run: ./supabase/scripts/validate-migration-runner.ps1

      # The following serialized phases are blocked by the readiness gate until
      # the reviewed baseline adapter and phase driver are explicitly approved.
      - name: Start runner-local Supabase stack
        run: bash scripts/ci/run-disposable-integration-phase.sh start-local-stack
      - name: Prepare disposable runtime environment
        run: bash scripts/ci/run-disposable-integration-phase.sh runtime-environment
      - name: Baseline validation
        run: bash scripts/ci/run-disposable-integration-phase.sh baseline
      - name: Authoritative schema preflight
        run: bash scripts/ci/run-disposable-integration-phase.sh schema-preflight
      - name: Negative identity cases
        run: bash scripts/ci/run-disposable-integration-phase.sh identity-negative
      - name: Clean identity fixtures and preflight
        run: bash scripts/ci/run-disposable-integration-phase.sh identity-clean
      - name: Canonical identity foundation
        run: bash scripts/ci/run-disposable-integration-phase.sh identity-foundation
      - name: Read-only identity reconciliation evidence
        run: bash scripts/ci/run-disposable-integration-phase.sh identity-evidence
      - name: Partial unique identity index
        run: bash scripts/ci/run-disposable-integration-phase.sh identity-index
      - name: Authorization migration
        run: bash scripts/ci/run-disposable-integration-phase.sh authorization-migration
      - name: Authorization, RLS, ACL, and audit verification
        run: bash scripts/ci/run-disposable-integration-phase.sh authorization-verification
      - name: Demo lifecycle migration
        run: bash scripts/ci/run-disposable-integration-phase.sh demo-migration
      - name: Demo lifecycle verification
        run: bash scripts/ci/run-disposable-integration-phase.sh demo-verification
      - name: Bootstrap runner-local credentialed Auth fixtures
        run: bash scripts/ci/run-disposable-integration-phase.sh auth-fixtures
      - name: Edge Function integration
        run: bash scripts/ci/run-disposable-integration-phase.sh edge-functions
      - name: Concurrency and replay
        run: bash scripts/ci/run-disposable-integration-phase.sh concurrency-replay
      - name: Password recovery through local InBucket
        run: bash scripts/ci/run-disposable-integration-phase.sh password-recovery

      - name: Write non-secret result summary
        if: ${{ always() }}
        run: deno run --allow-env --allow-write="$GITHUB_STEP_SUMMARY" scripts/ci/write-integration-summary.ts

      - name: Always stop and remove runner-local stack
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          shutdown_status=0
          fallback_status=0
          restoration_status=0
          supabase stop --no-backup 2>/dev/null || shutdown_status=$?
          disposable_ids="$(docker ps -aq --filter label=com.supabase.cli.project=bloodconnectindia-disposable-ci)" || fallback_status=$?
          if [[ $fallback_status -eq 0 && -n "$disposable_ids" ]]; then
            docker rm -f $disposable_ids >/dev/null 2>&1 || fallback_status=$?
          fi
          bash scripts/ci/cleanup-disposable-integration.sh || restoration_status=$?
          if [[ $restoration_status -ne 0 ]]; then
            echo "Migration restoration or approved-hash verification failed." >&2
            exit "$restoration_status"
          fi
          if [[ $shutdown_status -ne 0 && $fallback_status -ne 0 ]]; then
            echo "Both normal and fallback disposable stack cleanup failed." >&2
            exit "$fallback_status"
          fi
